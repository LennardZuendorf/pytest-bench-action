name: Benchmark (self-test)

# Dogfoods pytest-bench-action against its own sample suite in bench/.
# Proves action.yml runs end-to-end. Note: GitHub-hosted runners get a fresh
# hostname per job, so cross-run baseline comparison here is best-effort — the
# value is exercising the full step wiring, not stable numbers.
#
# PR-only trigger: baseline updates are staged as a commit on the PR branch
# and land on main when the PR merges — no push trigger, no direct commit to
# a (potentially rule-protected) main branch.
#
# concurrency: a new push to the PR (yours, or a bot like pre-commit.ci)
# re-fires this workflow via `synchronize`. Without a concurrency group, an
# in-flight run and the new run can both try to push a staged baseline commit
# to the same branch and race — the loser gets a non-fast-forward rejection.
# Cancelling the stale run avoids that.

on:
  pull_request:

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Run benchmarks via the action
    runs-on: ubuntu-latest
    steps:
      # A local action (uses: ./) requires the repo to be checked out first so
      # action.yml is present; the action then performs its own checkout.
      - uses: actions/checkout@v4

      - name: Benchmark and compare
        id: bench
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          python-version: "3.14"
          setup-command: python -m pip install --upgrade pip pytest pytest-benchmark
          benchmark-run-command: >
            pytest bench/
            --benchmark-only
            --benchmark-json=benchmark-results.json
            -q
          cross-branch-tolerance: 50
          update-tolerance: 10
          threshold-map: '{"sum_range": 0.5, "sort_list": 0.5, "str_join": 0.5}'

      - name: Show action outputs
        if: always()
        run: |
          echo "regression-detected: ${{ steps.bench.outputs.regression-detected }}"
          echo "baseline-updated:    ${{ steps.bench.outputs.baseline-updated }}"
          echo "node:                ${{ steps.bench.outputs.node }}"
