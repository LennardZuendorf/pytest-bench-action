# Ruff configuration for pytest-bench-action.
# Lints + formats the Python helper scripts and their test suite. The action's
# scripts/ stay stdlib-only at runtime — ruff and ty are dev tooling only.
target-version = "py311"
line-length = 100

[lint]
# Correctness (E/F) + import sorting (I) + pyupgrade (UP) + bugbear (B) +
# comprehensions (C4) + simplify (SIM) + ruff-specific (RUF). Line length is
# owned by the formatter, so E501 is intentionally not selected.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
